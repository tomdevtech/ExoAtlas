# Local development database. Start it with: docker compose up -d
services:
  db:
    image: postgres:17
    container_name: exofinder-db
    environment:
      POSTGRES_USER: exofinder
      POSTGRES_PASSWORD: exofinder
      POSTGRES_DB: exofinder
    ports:
      # Bound to localhost so the database is not reachable from the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exofinder -d exofinder"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
