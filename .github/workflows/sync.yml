name: Sync with NASA

# Syncs the production database with the NASA Exoplanet Archive once a day.
# It needs the repository secret PRODUCTION_DATABASE_URL.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seed-solar-system:
        description: "Store the solar system first (needed once for a new database)"
        type: boolean
        default: false
      force:
        description: "Write even when the response from NASA looks implausible"
        type: boolean
        default: false

permissions:
  contents: read

# Two syncs must never write at the same time, so a new run waits instead of
# cancelling the running one. A newer waiting run replaces an older waiting one.
concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Store the solar system
        if: ${{ inputs.seed-solar-system }}
        run: npm run seed:sol
      - name: Sync
        env:
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: npm run sync -- $FORCE
