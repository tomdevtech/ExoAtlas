name: Deployment check

# Smoke-tests each Vercel deployment and rolls production back if the test fails.
# Vercel must have "repository_dispatch Events" enabled (Project → Settings → Git).
# A manual run checks any address and never rolls back. Setup is in docs/DEPLOYMENT.md.
# It needs the secrets VERCEL_TOKEN and, with Deployment Protection,
# VERCEL_AUTOMATION_BYPASS_SECRET, plus the variables VERCEL_ORG_ID and VERCEL_PROJECT_ID.

on:
  repository_dispatch:
    types: [vercel.deployment.success]
  workflow_dispatch:
    inputs:
      url:
        description: "Address to check, for example https://exofinder.vercel.app"
        required: true
      environment:
        description: "production or preview (only for the log; a manual run never rolls back)"
        default: production
      sha:
        description: "Commit the deployment should run (optional)"
        required: false

permissions:
  contents: read

env:
  DEPLOY_URL: ${{ github.event.client_payload.url || inputs.url }}
  DEPLOY_ENVIRONMENT: ${{ github.event.client_payload.environment || inputs.environment }}
  DEPLOY_SHA: ${{ github.event.client_payload.git.sha || inputs.sha }}

# One check per environment at a time; a newer deployment waits for the older check.
concurrency:
  group: deploy-check-${{ github.event.client_payload.environment || inputs.environment }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      reachable: ${{ steps.reach.outputs.reachable }}
    env:
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      # Vercel may send the address without https://.
      - name: Address of the deployment
        run: |
          url="${DEPLOY_URL%/}"
          case "$url" in http://*|https://*) ;; *) url="https://$url" ;; esac
          echo "SMOKE_BASE_URL=$url" >> "$GITHUB_ENV"
          echo "SMOKE_EXPECTED_SHA=$DEPLOY_SHA" >> "$GITHUB_ENV"
          echo "Checking $url ($DEPLOY_ENVIRONMENT, commit ${DEPLOY_SHA:-unknown})"
      # A 401/403 is a setup problem (missing bypass secret), not a broken
      # deployment, so it must not trigger a rollback.
      - name: Can the check reach the deployment?
        id: reach
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            "$SMOKE_BASE_URL/health" || true)
          echo "/health answered ${status:-nothing}"
          if [ "$status" = "401" ] || [ "$status" = "403" ]; then
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "::error::Vercel's Deployment Protection blocks the check. Set the secret VERCEL_AUTOMATION_BYPASS_SECRET (docs/DEPLOYMENT.md)."
            exit 1
          fi
          echo "reachable=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The runner is pinned to ubuntu-24.04 because this Playwright version
      # cannot install its browser dependencies on Ubuntu 26.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
      - name: Keep the report of a failed check
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: smoke-report
          path: playwright-report/
          retention-days: 14

  rollback:
    needs: smoke
    # Roll back only Vercel-reported production deployments whose smoke test ran and
    # failed. startsWith is case-insensitive, so it matches "production" and "Production".
    if: >-
      ${{ failure()
      && github.event_name == 'repository_dispatch'
      && needs.smoke.outputs.reachable == 'true'
      && startsWith(github.event.client_payload.environment, 'production') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      FAILED_DEPLOYMENT_URL: ${{ github.event.client_payload.url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run deploy:rollback
      - name: Summary
        if: ${{ always() }}
        run: |
          {
            echo "## Production deployment failed its smoke test"
            echo ""
            echo "Failed deployment: $FAILED_DEPLOYMENT_URL (commit $DEPLOY_SHA)"
            if [ "${{ job.status }}" = "success" ]; then
              echo ""
              echo "The previous production deployment is live again."
              echo "Vercel now holds back new production deployments until one is promoted by hand:"
              echo "fix the problem, then in Vercel *Deployments → … → Promote* (see docs/DEPLOYMENT.md)."
            else
              echo ""
              echo "**The rollback failed.** Roll back by hand in Vercel: *Deployments → … → Instant Rollback*."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
