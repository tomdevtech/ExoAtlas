name: Database backup

# Dumps the production database weekly and keeps the dump for 90 days as a run artifact.
# Restoring is described in docs/DEPLOYMENT.md, "Backups". Any signed-in GitHub user
# can download artifacts, which is acceptable because the database holds no personal data.
# It needs the secret PRODUCTION_DATABASE_URL (direct address) and does nothing without it.

on:
  schedule:
    - cron: "41 4 * * 0" # Runs after the daily sync, so the dump includes its changes.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
    steps:
      - name: Dump
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::The secret PRODUCTION_DATABASE_URL is not set; nothing to back up."
            exit 0
          fi
          mkdir -p backup
          # pg_dump from the image must be at least as new as the database server.
          docker run --rm -e DATABASE_URL -v "$PWD/backup:/backup" postgres:18 \
            sh -c 'pg_dump --dbname="$DATABASE_URL" --format=custom --no-owner --no-privileges --file=/backup/exofinder.dump \
              && pg_restore --list /backup/exofinder.dump | grep -c "TABLE DATA"' \
            | { read -r tables; echo "Dump holds the data of $tables tables."; [ "$tables" -gt 0 ]; }
          ls -l backup
      - name: Keep the dump
        if: ${{ env.DATABASE_URL != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: exofinder-db-${{ github.run_id }}
          path: backup/exofinder.dump
          retention-days: 90
          if-no-files-found: error
