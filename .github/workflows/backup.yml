name: Database backup

# Dumps the production database once a week and keeps the dump for 90 days as
# an artifact of the run (Actions → Database backup → a run → Artifacts).
# Restoring is described in docs/DEPLOYMENT.md, "Backups".
#
# Most of the data can be fetched from NASA again at any time; the dump keeps
# what cannot: the change history, former names and the sync runs. The database
# holds no personal data. In a public repository every signed-in GitHub user
# can download artifacts, which is fine for this public catalogue.
#
# Needs the repository secret PRODUCTION_DATABASE_URL (direct address, as for
# the sync). Without it the workflow does nothing.

on:
  schedule:
    - cron: "41 4 * * 0" # Sundays at 04:41 UTC, after the daily sync
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
    steps:
      - name: Dump
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::The secret PRODUCTION_DATABASE_URL is not set; nothing to back up."
            exit 0
          fi
          mkdir -p backup
          # pg_dump from the image must be at least as new as the database server.
          docker run --rm -e DATABASE_URL -v "$PWD/backup:/backup" postgres:18 \
            sh -c 'pg_dump --dbname="$DATABASE_URL" --format=custom --no-owner --no-privileges --file=/backup/exoatlas.dump \
              && pg_restore --list /backup/exoatlas.dump | grep -c "TABLE DATA"' \
            | { read -r tables; echo "Dump holds the data of $tables tables."; [ "$tables" -gt 0 ]; }
          ls -l backup
      - name: Keep the dump
        if: ${{ env.DATABASE_URL != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: exoatlas-db-${{ github.run_id }}
          path: backup/exoatlas.dump
          retention-days: 90
          if-no-files-found: error
