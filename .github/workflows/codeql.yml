name: CodeQL

# GitHub's static security analysis; findings appear under Security → Code scanning.
# It is free for public repositories, but a private one needs GitHub Advanced Security.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 1" # Weekly, so newly added rules also scan unchanged code.

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
