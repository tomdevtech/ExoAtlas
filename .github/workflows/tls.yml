name: TLS check

# Checks TLS, certificates, security headers and redirects of the live site once a month.
# Monthly is enough because Vercel manages TLS and a push does not change it.
# It needs the repository variable PRODUCTION_URL and does nothing without it.

on:
  schedule:
    - cron: "23 5 1 * *"
  workflow_dispatch:
  # Changes to the check itself also run it, so a broken script shows up before the merge.
  pull_request:
    paths:
      - scripts/check-tls.sh
      - .github/workflows/tls.yml

permissions:
  contents: read

jobs:
  tls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v7
      - name: Check
        run: |
          if [ -z "$PRODUCTION_URL" ]; then
            echo "::notice::The repository variable PRODUCTION_URL is not set; nothing to check."
            exit 0
          fi
          host=$(echo "$PRODUCTION_URL" | sed -E 's#^https?://##; s#/.*$##')
          bash scripts/check-tls.sh "$host"
