# Weekly grouped update pull requests; CI checks each of them before merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # Minor and patch updates are bundled to keep the number of pull requests low.
      minor-and-patch:
        update-types: [minor, patch]
      # Next.js, React and their ESLint config must be upgraded together.
      next-react:
        patterns:
          [
            "next",
            "eslint-config-next",
            "react",
            "react-dom",
            "@types/react",
            "@types/react-dom",
          ]
      # The test runner and the browser library must stay on the same version.
      playwright:
        patterns: ["playwright", "@playwright/test"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
